<style>

.sw{display:flex;gap:14px;flex-wrap:wrap}

.dot{width:18px;height:18px;border-radius:50%;display:inline-block}
form,.card,.stat,.wrap{border-radius:12px}

nav button{border-radius:8px 8px 0 0}

.hl{display:flex;align-items:center;gap:10px}
.sm{padding:4px 10px!important;font-size:.8rem!important;font-weight:600!important;border-radius:6px}

.link.e:hover,.link.v:hover,.link.del:hover{text-decoration:none;background:color-mix(in srgb,currentColor 24%,transparent)}

</style>
</head>
<body>
<main>
<header><h1 id="ttl">نظام المخزن والفواتير</h1><div class="hl"><span id="st">جارٍ الاتصال...</span><button class="link" id="lo">تسجيل الخروج</button><button class="sec sm" id="th" type="button"></button></div></header>

<script>
let db=null,tab="inv",ready=false,after=null,pending=false,raf=0;
const S={items:[],customers:[],invoices:[],biz:{}};
const Q={items:"",cust:"",inv:""};
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())};
let draft={cid:"",date:today(),lines:[],cname:"",caddr:""};
let paste={open:false,text:"",rows:null};
const THEME="medsupplies.theme";
try{const t=localStorage.getItem(THEME);if(t)document.documentElement.dataset.theme=t}catch(e){}
const curTheme=()=>document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
const updTheme=()=>{const b=document.getElementById("th");if(b)b.textContent=curTheme()==="dark"?"فاتح":"داكن"};
const DEF={name:"شركة الرحمن",p1:"",p2:"",title:"فاتورة مبيعات",hd:"#8eaadb",fs:15,logo:"",note:"",su:true,sa:true,sb:true,ff:"Tahoma",fw:true,fapp:false,app:"نظام المخزن والفواتير",acc:"blue",units:"",tc:"#000000",ts:14,tb:true,ic:"#000000",is:11,ib:true,hc:"#000000",hs:12,hb:true,bc:"#000000",bs:11,bb:true,rh:12.6,na:"right",tf:"#8eaadb",tx:"#000000",bd:"1",bcol:"#000000",w0:5.9,w1:44.2,w2:10.7,w3:11.2,w4:13.2,w5:14.8};

const $=s=>document.querySelector(s);
const say=t=>{$("#msg").textContent=t||""};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(+n||0).toLocaleString("en-US",{maximumFractionDigits:2,useGrouping:false});
const r2=n=>Math.round(n*100)/100;
const cust=id=>S.customers.find(c=>c.id===id);
const sumLines=l=>r2(l.reduce((a,x)=>a+x.price*x.qty,0));
const txt=h=>{const n=parseInt(h.slice(1),16),l=((n>>16)&255)*.299+((n>>8)&255)*.587+(n&255)*.114;return l>150?"#000":"#fff"};
const ffName=b=>String(b.ff||"Tahoma").replace(/["'`;<>{}\\]/g,"");
const hasFont=n=>{const c=hasFont.c||(hasFont.c=document.createElement("canvas").getContext("2d")),t="فاتورة مبيعات abc 0123",w=f=>{c.font="40px "+f;return c.measureText(t).width};return ["monospace","serif","sans-serif"].some(f=>w(`"${n}",${f}`)!==w(f))};

const FONTS=["Tahoma","Arial","Segoe UI","Traditional Arabic","Simplified Arabic","Sakkal Majalla","Arabic Typesetting","Times New Roman","Calibri","Cambria","Dubai","Verdana","Microsoft Sans Serif","Roboto","Noto Naskh Arabic","Noto Sans Arabic","Noto Kufi Arabic","Droid Sans Arabic","Geeza Pro","Al Bayan","Baghdad","Damascus","Cairo","Amiri","Tajawal","Almarai","Scheherazade New","Lateef"];
const SPEC=[
["عنوان الفاتورة",[["tc","لون الخط","color"],["ts","حجم الخط","num"],["tb","عريض","chk"]]],
["بيانات الشركة والعميل (أعلى الفاتورة)",[["ic","لون الخط","color"],["is","حجم الخط","num"],["ib","عريض","chk"]]],
["صف عناوين الجدول",[["hd","لون التعبئة","color"],["hc","لون الخط","color"],["hs","حجم الخط","num"],["hb","عريض","chk"]]],
["صفوف الأصناف",[["bc","لون الخط","color"],["bs","حجم الخط","num"],["bb","عريض","chk"],["rh","ارتفاع الصف","num"],["na","محاذاة اسم الصنف","sel:right|يمين,center|وسط"]]],
["صف الاجمالي",[["tf","لون التعبئة","color"],["tx","لون الخط","color"]]],
["الحدود",[["bd","سمك الحد","sel:0|بدون,1|رفيع,2|متوسط,3|سميك"],["bcol","لون الحد","color"]]],
["عرض الأعمدة (نسبة %)",[["w0","أ","num"],["w1","اسم الصنف","num"],["w2","الوحدة","num"],["w3","الكمية","num"],["w4","السعر","num"],["w5","القيمة","num"]]]
];
const fld=(k,l,t,b)=>t==="color"?`<label style="flex:0 1 130px">${l}<input type="color" name="${k}" value="${esc(b[k])}" style="padding:2px;height:40px"></label>`:t==="num"?`<label style="flex:0 1 110px">${l}<input type="number" name="${k}" step="any" min="0" value="${esc(b[k])}"></label>`:t==="chk"?`<label style="flex-direction:row;align-items:center;gap:8px;flex:0 0 auto"><input type="checkbox" name="${k}" ${b[k]?"checked":""} style="width:auto">${l}</label>`:`<label style="flex:0 1 150px">${l}<select name="${k}">${t.slice(4).split(",").map(o=>{const[v,x]=o.split("|");return `<option value="${v}" ${String(b[k])===v?"selected":""}>${x}</option>`}).join("")}</select></label>`;
const readSet=f=>{
  const o={name:f.get("name").trim(),p1:f.get("p1").trim(),p2:f.get("p2").trim(),title:f.get("title").trim()||"فاتورة مبيعات",note:f.get("note").trim(),su:f.get("su")==="on",sa:f.get("sa")==="on",sb:f.get("sb")==="on",ff:((f.get("ffc")||"").trim().replace(/["'`;<>{}\\]/g,"")||f.get("ff")||"Tahoma"),app:(f.get("app")||"").trim()||"نظام المخزن والفواتير"};
  SPEC.forEach(g=>g[1].forEach(([k,l,t])=>{o[k]=t==="chk"?f.get(k)==="on":t==="num"?(+f.get(k)||DEF[k]):(f.get(k)||DEF[k])}));
  return o;
};
const sample=()=>({no:"INV-0000",date:today(),cname:"صيدلية د / نموذج",caddr:"العنوان - المدينة",lines:[{name:"صنف تجريبي 1",unit:"قطعة",price:10,qty:5},{name:"صنف تجريبي 2",unit:"علبة",price:25,qty:2}],total:100,prev:500,net:600});
/* ---------- التخزين على السحابة ---------- */
const run=async f=>{try{await f()}catch(e){say("تعذر الحفظ: "+((e&&e.message)||e))}};
const put=(c,o)=>run(()=>db.collection(c).doc(o.id).set(o));
const rm=(c,id)=>run(()=>db.collection(c).doc(id).delete());
const saveBiz=o=>run(()=>db.doc("settings/main").set(Object.assign({},S.biz,o)));
const schedule=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const a=document.activeElement;if(!after&&a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&$("#view").contains(a)){pending=true;return}render()})};
document.addEventListener("focusout",()=>{if(pending)setTimeout(()=>{const a=document.activeElement;if(!a||!/INPUT|SELECT|TEXTAREA/.test(a.tagName)){pending=false;render()}},0)});
/* ====== إعدادات Firebase: الصقي هنا بيانات مشروعك ====== */
const CONFIG={apiKey:"AIzaSyBQz-IIAelniZDkebW03DC41t1lzkH4bF4",authDomain:"warehouse-5f85b.firebaseapp.com",projectId:"warehouse-5f85b",storageBucket:"warehouse-5f85b.firebasestorage.app",messagingSenderId:"583310421444",appId:"1:583310421444:web:2da815085f4554abb68891"};
let auth=null,unsub=[];
function start(fs){
  db=fs;let got=0;const first=()=>{if(++got===4){ready=true;$("#st").textContent="البيانات محفوظة أونلاين"}schedule()};
  const sub=(c,k)=>{let f=false;unsub.push(db.collection(c).onSnapshot(sn=>{S[k]=sn.docs.map(d=>Object.assign({id:d.id},d.data()));S[k].sort((a,b)=>(a.t||0)-(b.t||0));if(!f){f=true;first()}else schedule()},er=>say("تعذر تحميل البيانات: "+er.message)))};
  sub("items","items");sub("customers","customers");sub("invoices","invoices");
  let f=false;unsub.push(db.doc("settings/main").onSnapshot(s=>{S.biz=s.exists?s.data():{};applyFont();if(!f){f=true;first()}else schedule()},er=>say("تعذر تحميل الإعدادات: "+er.message)));
}
function init(){
  if(CONFIG.apiKey.startsWith("PASTE")){$("#login").classList.add("on");$("#f-login").innerHTML='<h2 style="margin:0">الموقع محتاج ربط قاعدة البيانات</h2><p class="msg" style="margin:0">لسه ماتحطتش إعدادات Firebase في أول السكريبت داخل ملف index.html.</p>';return}

}
let QD="all";
const iso=d=>{const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())};

const AD="٠١٢٣٤٥٦٧٨٩",PD="۰۱۲۳۴۵۶۷۸۹";
const nd=s=>s.replace(/[٠-٩]/g,c=>AD.indexOf(c)).replace(/[۰-۹]/g,c=>PD.indexOf(c));
const nrm=s=>nd(String(s)).toLowerCase().replace(/[\u064B-\u065F\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/(\d)(\p{L})/gu,"$1 $2").replace(/(\p{L})(\d)/gu,"$1 $2").replace(/\s+/g," ").trim();
const sa=t=>t.length>4&&t.startsWith("ال")?t.slice(2):t;
const STOP=new Set(["من","في","لو","سمحت","ياريت","محتاج","محتاجه","عايز","عايزه","طلبيه","الطلبيه","اوردر","طلب","برجاء","شكرا","و","كمان","عندي","ممكن"].map(nrm));
const MK=new Set(["x","عدد","كميه"].map(nrm));
const UW=new Set(["قطعه","قطع","علبه","علب","شريط","اشرطه","كرتونه","كراتين","كرتون","حصيره","حصاير","زجاجه","عبوه","عبوات","كيس","اكياس","باكو","دسته","دست","بكره","لفه"].map(nrm));
const NUM=/^\d+$/;
const lev1=(a,b)=>{if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(a.length<b.length)j++;else{i++;j++}}return e+(a.length-i)+(b.length-j)<=1};
const tw=(a,b)=>{if(a===b)return 1;if(/^\d/.test(a)||/^\d/.test(b))return 0;if(a.length>=3&&b.length>=3&&(a.startsWith(b)||b.startsWith(a)))return .75;if(a.length>=4&&b.length>=4&&lev1(a,b))return .8;return 0};
const mscore=(A,B)=>{if(!A.length||!B.length)return 0;const used=new Array(A.length).fill(false);let cov=0,mA=0;B.forEach(b=>{let best=0,bi=-1;A.forEach((a,i)=>{const w=tw(a,b);if(w>best){best=w;bi=i}});if(best>0){cov+=best;if(!used[bi]){used[bi]=true;mA+=best}}});const c=cov/B.length,p=mA/A.length;return c+p?2*c*p/(c+p):0};
const toks=s=>nrm(s).split(" ").filter(t=>t&&!STOP.has(t)).map(sa);
function parseOrder(text){
  const items=S.items.map(i=>({i,tk:toks(i.name)}));
  const lines=String(text).split(/[\n\r،؛;+,]+/).map(x=>x.trim()).filter(Boolean);
  const rows=[];
  lines.forEach(raw0=>{
    const raw=raw0.replace(/^\s*[\u2022•\-–*]+\s*/,"").replace(/^\s*[0-9٠-٩]+\s*[.)]\s*/,"");
    const t=nrm(raw.replace(/[×✕✖*]/g," x ")).split(" ").filter(Boolean);
    if(!t.length||!/\p{L}/u.test(t.join(" ")))return;
    const cands=[],mk=(qty,rem,bias)=>cands.push({qty,rem,bias});
    t.forEach((w,i)=>{if(!NUM.test(w))return;const rem=t.slice();let m=false;
      if(i>0&&MK.has(t[i-1])){m=true;rem.splice(i-1,2)}
      else if(i+1<t.length&&(t[i+1]==="x"||UW.has(t[i+1]))){m=true;rem.splice(i,2)}
      if(m)mk(+w,rem,.03)});
    if(t.length>1&&NUM.test(t[0])){const r=t.slice(1);if(UW.has(r[0]))r.shift();mk(+t[0],r,.02)}
    if(t.length>1&&NUM.test(t[t.length-1]))mk(+t[t.length-1],t.slice(0,-1),.01);
    mk(1,t,0);
    let best={sc:0,qty:1,it:null};
    cands.forEach(c=>{const A=c.rem.filter(w=>!MK.has(w)&&!STOP.has(w)).map(sa);if(!A.length)return;items.forEach(o=>{const sc=mscore(A,o.tk)+c.bias;if(sc>best.sc)best={sc,qty:c.qty,it:o.i}})});
    const ok=best.it&&best.sc>=.55;
    rows.push({raw:raw0,iid:ok?best.it.id:null,qty:best.it?best.qty:1,price:ok?best.it.price:0,sc:best.sc});
  });
  return rows;
}

    (draft.lines.length?`<div class="card"><div class="sum"><div><span>الاجمالي</span><span>${fmt(total)}</span></div>${draft.edit?"":`<div><span>الرصيد السابق</span><span>${c?fmt(c.prev):"-"}</span></div><div><span>الصافي</span><span>${c?fmt(c.net):"-"}</span></div>`}</div>${draft.edit?`<label style="flex:0 1 140px">الرصيد السابق<input id="d-prev" type="number" step="0.01" value="${draft.prev}"></label><label style="flex:0 1 140px">الصافي<input id="d-net" type="number" step="0.01" value="${draft.net}"></label>`:""}
    <p class="hint" style="flex:1 1 220px;margin:0">الرصيد السابق والصافي بيتاخدوا من تبويب "الرصيد السابق والصافي". <button type="button" class="link" data-go="bal">فتح التبويب</button></p>
    <button class="primary" id="mk" style="flex-basis:100%">${draft.edit?"حفظ التعديلات":"إنشاء الفاتورة"}</button></div>`:"")+
    `<h2>الفواتير المحفوظة</h2>`+search("inv","ابحث باسم العميل أو رقم الفاتورة...")+chips()+
    table(`<th>الرقم</th><th>التاريخ</th><th>العميل</th><th>الاجمالي</th><th>الرصيد السابق</th><th>الصافي</th><th></th>`,
      dfl(flt(inv,Q.inv,n=>n.cname+" "+n.no)).map(n=>`<tr><td>${esc(n.no)}</td><td>${esc(n.date.replace(/-/g,"/"))}</td><td>${esc(n.cname)}</td><td>${fmt(n.total)}</td><td>${fmt(n.prev)}</td><td>${fmt(n.net)}</td><td><button class="link v" data-view="${n.id}">عرض / طباعة</button><button class="link e" data-einv="${n.id}">تعديل</button><button class="link del" data-del="invoices" data-id="${n.id}">حذف</button></td></tr>`),
      S.invoices.length?"لا توجد نتائج.":"لا توجد فواتير بعد.");
  }
}
function render(o={}){
  o=Object.assign({},after,o);after=null;
  const y=window.scrollY,same=render.last===tab;
  draw();render.last=tab;
  const v=$("#view");
  if(!same){v.classList.remove("fade");void v.offsetWidth;v.classList.add("fade");window.scrollTo({top:0,behavior:"instant"})}
  else window.scrollTo({top:y,behavior:"instant"});
  if(o.focus){const el=$(o.focus);if(el){el.focus({preventScroll:true});if(o.caret&&el.setSelectionRange){const n=el.value.length;el.setSelectionRange(n,n)}}}
  if(o.flash){const r=document.querySelector("#view tbody tr:last-child");if(r)r.classList.add("flash")}
}
function showInvoice(n,b=B()){
  const cols=colW(b).map(x=>`<col style="width:${x}%">`).join("");
  $("#inv").innerHTML=`<div class="actions"><button class="primary" id="pr">طباعة</button>${n.id?`<button class="sec" id="ed">تعديل</button>`:""}<button class="sec" id="dl">تنزيل الفاتورة</button><button class="sec" id="cl">إغلاق</button><span id="pm" class="hint" style="margin:0;align-self:center"></span></div>
  <div class="paper" style="${invStyle(b)}">${b.logo?`<img class="logo" src="${esc(b.logo)}" alt="">`:""}<h3>${esc(b.title)}</h3>
  <div class="head"><div class="r"><div>اسم الشركة : ${esc(b.name)}</div><div>تاريخ الفاتورة : ${esc(n.date.replace(/-/g,"/"))}</div><div>اسم العميل : ${esc(n.cname)}</div>${b.sa&&n.caddr?`<div>العنوان : ${esc(n.caddr)}</div>`:""}</div>
  <div class="l">${b.p1?`<div>رقم الهاتف : ${esc(b.p1)}</div>`:""}${b.p2?`<div>رقم الهاتف : ${esc(b.p2)}</div>`:""}</div></div>
  <table class="inv"><colgroup>${cols}</colgroup><thead><tr><th>أ</th><th>اسم الصنف</th>${b.su?"<th>الوحدة</th>":""}<th>الكمية</th><th>السعر</th><th>القيمة</th></tr></thead><tbody>
  ${n.lines.map((l,k)=>`<tr><td>${k+1}</td><td class="nm">${esc(l.name)}</td>${b.su?`<td>${esc(l.unit)}</td>`:""}<td>${fmt(l.qty)}</td><td>${l.price?fmt(l.price):""}</td><td>${l.price?fmt(l.price*l.qty):""}</td></tr>`).join("")}
  </tbody><tfoot><tr><td class="nb" colspan="${b.su?4:3}"></td><td class="lb">الاجمالي</td><td>${fmt(n.total)}</td></tr></tfoot></table>
  ${b.sb?`<div class="foot"><div>الرصيد السابق : ${fmt(n.prev)}</div><div>الصافي : ${fmt(n.net)}</div></div>`:""}${b.note?`<div class="note">${esc(b.note)}</div>`:""}</div>`;
  const p=$("#inv .paper");p.dataset.no=n.no;p.dataset.id=n.id||"";
  $("#inv").classList.add("on");
  const z=Math.min(1,(window.innerWidth-24)/p.offsetWidth);p.style.zoom=z<1?z:"";
}
async function downloadInvoice(){
  const p=$("#inv .paper").cloneNode(true);p.style.zoom="";
  const html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(p.dataset.no)}</title><style>${document.querySelector("style").textContent}body{background:#fff!important;display:block!important}</style></head><body>${p.outerHTML}</body></html>`;
  await saveFile((p.dataset.no||"invoice")+".html",html);
}
async function saveFile(filename,data){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data],{type:(filename.endsWith(".json")?"application/json":"text/html")+";charset=utf-8"}));
  a.download=filename;document.body.appendChild(a);a.click();a.remove();
}
/* ---------- القوائم المنسدلة ---------- */
const UNITS=["قطعة","شريط","علبة","حصيرة","كرتونة","زجاجة","عبوة","كيس","لتر","متر"];
let cbOpen=null,cbPicking=false;
function cbOpts(inp,all){
  const q=all?"":inp.value.trim();
  if(inp.dataset.combo==="units")return unitsList().filter(u=>u.includes(q)).map(u=>({v:u,l:u}));
  return S.items.filter(i=>i.name.includes(q)).map(i=>({v:i.name,l:i.name,s:i.unit+" - "+fmt(i.price)}));
}
function cbClose(){if(cbOpen){const l=cbOpen.querySelector(".cbl");if(l)l.classList.remove("on");cbOpen=null}}
function cbShow(w,all){
  cbClose();
  const inp=w.querySelector("input"),l=w.querySelector(".cbl"),items=cbOpts(inp,all);
  l.innerHTML=items.length?items.map((o,k)=>`<div data-k="${k}"><span>${esc(o.l)}</span>${o.s?`<small>${esc(o.s)}</small>`:""}</div>`).join(""):`<div class="none">${inp.dataset.combo==="items"?"لا توجد أصناف مطابقة":"اكتبي الوحدة"}</div>`;
  l._items=items;l.classList.add("on");cbOpen=w;
  l.scrollIntoView({block:"nearest"});
}
function cbPick(w,k){
  const l=w.querySelector(".cbl"),o=l._items&&l._items[k],inp=w.querySelector("input");if(!o)return;
  cbClose();cbPicking=true;inp.value=o.v;
  inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}));
  cbPicking=false;
  if(inp.dataset.combo==="items"&&inp.form&&inp.form.qty){inp.form.qty.focus();inp.form.qty.select()}
}
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.combo&&!cbPicking)cbShow(t.closest(".cbw"),false)});
document.addEventListener("click",e=>{
  const t=e.target,b=t.closest&&t.closest(".cbb");
  if(b){const w=b.closest(".cbw");if(cbOpen===w)cbClose();else cbShow(w,true);return}
  const d=t.closest&&t.closest(".cbl div[data-k]");
  if(d){cbPick(d.closest(".cbw"),+d.dataset.k);return}
  if(!(t.closest&&t.closest(".cbw")))cbClose();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")cbClose()});
/* ---------- الأحداث ---------- */
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b){tab=b.dataset.tab;render()}});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="d-cname")draft.cname=t.value;
  if(t.id==="d-caddr")draft.caddr=t.value;
  if(t.id==="po-text")paste.text=t.value;
  if(t.dataset.q){Q[t.dataset.q]=t.value;render({focus:"#q",caret:true})}
  if(t.name==="iname"){const i=S.items.find(x=>x.name===t.value);if(i)t.form.price.value=i.price}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="d-cid"){draft.cid=t.value;const c=cust(t.value);draft.cname=c?c.name:"";draft.caddr=c?c.addr||"":"";render()}
  if(t.id==="d-date")draft.date=t.value;
  if(t.id==="d-prev")draft.prev=+t.value||0;
  if(t.id==="d-net")draft.net=+t.value||0;
  if(t.dataset.po){const r=paste.rows&&paste.rows[+t.dataset.k];if(r){if(t.dataset.po==="sel"){r.iid=t.value||null;const it=S.items.find(x=>x.id===r.iid);if(it)r.price=it.price}else r[t.dataset.po]=Math.max(0,+t.value||0);render()}}
  if(t.dataset.ln){const l=draft.lines[+t.dataset.k];if(l){l[t.dataset.ln]=Math.max(0,+t.value||0);render()}}
  if(t.dataset.bal){const c=cust(t.dataset.id);if(c){put("customers",Object.assign({},c,{[t.dataset.bal]:+t.value||0}));const s=$("#sv");if(s)s.textContent="تم الحفظ"}}
  if(t.name==="iname"){const i=S.items.find(x=>x.name===t.value);if(i)t.form.price.value=i.price}
  if(t.id==="fw")saveBiz({fw:t.checked});
  if(t.id==="fapp")saveBiz({fapp:t.checked});
  if(t.id==="lg"){const f=t.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,240/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);let u=c.toDataURL("image/png");if(u.length>180000)u=c.toDataURL("image/jpeg",.8);saveBiz({logo:u})};im.src=URL.createObjectURL(f)}
  if(t.id==="rs"){
    const f=t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>run(async()=>{let d;try{d=JSON.parse(r.result);if(!d.items||!d.customers||!d.invoices)throw 0}catch(_){say("هذا الملف ليس نسخة احتياطية صالحة.");return}
      if(!confirm("إضافة بيانات هذه النسخة إلى بياناتك الحالية؟"))return;
      say("جارٍ الاسترجاع...");
      if(d.biz)await saveBiz(d.biz);
      let t0=Date.now();
      for(const i of d.items)await put("items",{id:i.id||uid(),name:i.name,unit:i.unit,price:+i.price||0,t:t0++});
      for(const c of d.customers)await put("customers",{id:c.id||uid(),name:c.name,addr:c.addr||"",phone:c.phone||"",prev:+c.prev||0,net:+c.net||0,t:t0++});
      for(const n of d.invoices){const o=Object.assign({},n);o.id=o.id||uid();o.n=o.n||parseInt(String(o.no).slice(4))||0;o.t=o.t||t0++;await put("invoices",o)}
      say("تم الاسترجاع.")});
    r.readAsText(f);
  }
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(t.id==="th"){const n=curTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem(THEME,n)}catch(e){}updTheme();return}
  if(t.id==="pr"){try{window.print()}catch(_){}const m=$("#pm");if(m)m.textContent="لو الطباعة ما اشتغلتش، اضغط تنزيل الفاتورة وافتح الملف واطبعه.";return}
  if(t.id==="lo"){auth&&auth.signOut();return}
  if(t.id==="dl")return downloadInvoice();
  if(t.id==="cl")return $("#inv").classList.remove("on");
  if(t.id==="bk"){saveFile("backup-"+today()+".json",JSON.stringify({biz:S.biz,items:S.items,customers:S.customers,invoices:S.invoices},null,1));return}
  if(d.qd){QD=d.qd;render();return}
  if(t.id==="po-open"){paste.open=true;render({focus:"#po-text"});return}
  if(t.id==="po-close"){paste={open:false,text:"",rows:null};render();return}
  if(t.id==="po-go"){const ta=$("#po-text");paste.text=ta?ta.value:paste.text;if(!paste.text.trim()){say("الصقي الطلبية الأول.");return}paste.rows=parseOrder(paste.text);render();return}
  if(t.id==="po-add"){(paste.rows||[]).forEach(r=>{const it=S.items.find(x=>x.id===r.iid);if(!it||!(r.qty>0))return;const ex=draft.lines.find(l=>l.iid===it.id&&l.price===r.price);if(ex)ex.qty=r2(ex.qty+r.qty);else draft.lines.push({iid:it.id,name:it.name,unit:it.unit,price:r.price,qty:r.qty})});paste={open:false,text:"",rows:null};render({flash:true});return}
  if(d.einv){editInvoice(d.einv);return}
  if(t.id==="ed"){editInvoice($("#inv .paper").dataset.id);return}
  if(t.id==="canc"){draft={cid:"",date:today(),lines:[],cname:"",caddr:""};render();return}
  if(d.go){tab=d.go;render();return}
  if(d.ff){saveBiz({ff:d.ff});return}
  if(d.ffc){const n=$("#ffc").value.trim().replace(/["'`;<>{}\\]/g,"");if(n)saveBiz({ff:n});return}
  if(t.id==="pvf"){showInvoice(sample());return}
  if(t.id==="pv"){showInvoice(sample(),Object.assign(B(),readSet(new FormData($("#f-set")))));return}
  if(t.id==="rl"){saveBiz({logo:""});return}
  if(d.rmline){draft.lines.splice(+d.rmline,1);render()}
  if(d.view)showInvoice(S.invoices.find(n=>n.id===d.view));
  if(d.ebal){const n=S.invoices.find(x=>x.id===d.ebal),p=prompt("الرصيد السابق",n.prev);if(p===null)return;const q=prompt("الصافي",n.net);if(q===null)return;const m=Object.assign({},n,{prev:+p||0,net:+q||0});put("invoices",m);showInvoice(m)}
  if(d.eitem){const i=S.items.find(x=>x.id===d.eitem),nm=prompt("اسم الصنف",i.name);if(nm===null||!nm.trim())return;const p=prompt("السعر",i.price);if(p===null||p===""||!(+p>=0))return;put("items",Object.assign({},i,{name:nm.trim(),price:+p}))}
  if(d.ecust){const c=S.customers.find(x=>x.id===d.ecust),nm=prompt("اسم العميل",c.name);if(nm===null||!nm.trim())return;const a=prompt("العنوان",c.addr||"");if(a===null)return;const ph=prompt("الهاتف",c.phone||"");if(ph===null)return;put("customers",Object.assign({},c,{name:nm.trim(),addr:a.trim(),phone:ph.trim()}))}
  if(d.del){if(!confirm("هل تريد الحذف؟ لا يمكن التراجع."))return;rm(d.del,d.id)}
  if(t.id==="mk"){
    const c=cust(draft.cid);
    if(!c){say("اختر العميل قبل إنشاء الفاتورة.");return}
    const old=draft.edit&&S.invoices.find(x=>x.id===draft.edit);const num=old?old.n:Math.max(0,...S.invoices.map(x=>x.n||parseInt(String(x.no).slice(4))||0))+1;
    const n={id:old?old.id:uid(),n:num,no:old?old.no:"INV-"+String(num).padStart(4,"0"),date:draft.date,cid:c.id,cname:(draft.cname||"").trim()||c.name,caddr:(draft.caddr||"").trim(),lines:draft.lines,total:sumLines(draft.lines),prev:old?(+draft.prev||0):(c.prev||0),net:old?(+draft.net||0):(c.net||0),t:old?old.t:Date.now()};
    put("invoices",n);
    draft={cid:"",date:today(),lines:[],cname:"",caddr:""};render();showInvoice(n);
  }

document.addEventListener("submit",e=>{
  e.preventDefault();const f=new FormData(e.target),id=e.target.id;
  if(id==="f-item"){after={focus:"#f-item input",flash:true};put("items",{id:uid(),name:f.get("name").trim(),unit:f.get("unit").trim(),price:+f.get("price"),t:Date.now()})}
  else if(id==="f-cust"){after={focus:"#f-cust input",flash:true};put("customers",{id:uid(),name:f.get("name").trim(),addr:f.get("addr").trim(),phone:f.get("phone").trim(),prev:0,net:0,t:Date.now()})}
  else if(id==="f-login"){
    $("#lerr").textContent="";
    auth.signInWithEmailAndPassword(f.get("email").trim(),f.get("pass")).catch(er=>{const c=er.code||"";$("#lerr").textContent=/api-key/.test(c)?"إعدادات الموقع فيها خطأ في مفتاح الـ API.":/operation-not-allowed/.test(c)?"الدخول بالإيميل مش مفعّل في Firebase.":/invalid|wrong-password|user-not-found/.test(c)?"البريد أو كلمة المرور غير صحيحة.":c==="auth/network-request-failed"?"تأكدي من الاتصال بالإنترنت.":"تعذر الدخول: "+c});
  }
  else if(id==="f-set")saveBiz(readSet(f));
  else if(id==="f-line"){
    const i=S.items.find(x=>x.name===f.get("iname").trim());
    if(!i){say("اختار صنف موجود من القائمة.");return}
    draft.lines.push({iid:i.id,name:i.name,unit:i.unit,price:+f.get("price"),qty:+f.get("qty")});render({focus:"#f-line [name=iname]",flash:true});
  }
});
